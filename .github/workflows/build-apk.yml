name: Build Arrow Escape APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Extract game project
        run: |
          mkdir app
          unzip build-arrow-escape-puzzle-game.zip -d app
          PROJECT_DIR=$(find app -name package.json -not -path '*/node_modules/*' -printf '%h\n' | head -n 1)
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV

      - name: Install dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: npm ci

      - name: Build game
        working-directory: ${{ env.PROJECT_DIR }}
        run: npm run build

      - name: Setup Capacitor
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          npm install @capacitor/core@6 @capacitor/android@6
          npm install --save-dev @capacitor/cli@6
          echo '{"appId":"com.arrowescape.game","appName":"Arrow Escape","webDir":"dist"}' > capacitor.config.json
          npx cap add android
          npx cap sync android
      - name: Generate App Icon
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          mkdir -p assets
          cp "$GITHUB_WORKSPACE/icon.png" assets/icon.png
          npm install --save-dev @capacitor/assets
          npx capacitor-assets generate --android
      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}/android
        run: chmod +x gradlew && ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Arrow-Escape-APK
          path: ${{ env.PROJECT_DIR }}/android/app/build/outputs/apk/debug/app-debug.apk
